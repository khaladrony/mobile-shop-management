
<div growl style="position: fixed; float: right; top:50px; right: 10px;"></div>

<div class="row" ng-init="getCoaList()">

    <div class="col-sm-2 col-md-2 col-lg-2">&nbsp;</div>

    <div class="col-sm-9 col-md-9 col-lg-9">

        <div class="widget-box">
            <div class="widget-header row">
                <!-- Left: Title -->
                <div class="col-sm-4">
                    <h4 class="widget-title">
                        {{page_name}}
                    </h4>
                    <p class="subtitle">Record non-cash,bank or adjustment entries</p>
                </div>

                <!-- Center: Voucher Info -->
                <div class="col-sm-6" >
                    <span class="widget-toolbar pull-left">
                        <span style="color: #00689c; font-weight: normal;">Voucher No:</span>
                        <strong style="color: black;">{{module.voucherNo}}</strong>
                        &nbsp;&nbsp;
                    </span>
                    <!--<span class="widget-toolbar pull-left">
                        <span style="color: #00689c; font-weight: normal;">Voucher Date:</span>
                        <strong style="color: black;">{{module.voucherDate | date: 'dd-MM-yyyy'}}</strong>
                    </span>-->
                </div>

                <!-- Right: Back Button -->
                <div class="col-sm-2 text-right">
                    <span class="widget-toolbar pull-right">
                        <a class="btn btn-sm btn-primary" ui-sref="{{JCOMPONENT.acc_journal_voucher_list_view}}">
                            <i class="ace-icon fa fa-backward"></i> Back
                        </a>
                    </span>
                </div>
            </div>

            <div class="widget-body">
                <div class="widget-main">
                    <form ng-submit="saveModule()">
                        <div class="widget-main">
                            <div class="row">
                                <div class="col-xs-12 col-md-2">
                                    <voucher-date-picker
                                            ng-model="module.voucherDate"
                                            label="Date"
                                            required="true"
                                            block-typing="true">
                                    </voucher-date-picker>
                                </div>

                                <div class="col-xs-12 col-md-8">
                                    <particulars-field ng-model="module.particulars"></particulars-field>
                                </div>
                            </div>
                        </div>

                        <br>

                        <div class="widget-body">
                            <div class="widget-main">
                                <div class="widget-header widget-header-flat">
                                    <h4 class="widget-title" style="font-size:17px;">Voucher Details</h4>
                                    <span class="widget-toolbar"> </span>
                                </div>

                                <div class="row">
                                    <div class="col-xs-12 col-md-5">
                                        <label>Chart of Accounts <span class="required">*</span></label>
                                        <lazy-dropdown
                                                selected-item="selectedCoa"
                                                display-property="coa_code_name"
                                                display-subtext="accounts_type"
                                                search-property="coa_code_name"
                                                placeholder="Search chart of accounts..."
                                                load-items="fetchChartOfAccounts(params)"
                                                on-select="onChartOfAccountsChange(item)">
                                        </lazy-dropdown>
                                    </div>

                                    <div ng-class="particularsDivClassVar">
                                        <label>Particulars <span ng-if="isRequired" class="required">*</span></label>
                                        <input class="form-control"
                                               type="text"
                                               id="particulars"
                                               ng-model="voucher_details.particulars"
                                               placeholder="Particulars" />
                                    </div>

                                </div>

                                <div class="row  ">
                                    <div class="col-xs-12 col-md-5" ng-hide="isSubAccHide">
                                        <label>{{ voucher_details.chartOfAccountsSource || 'Sub-account' }}<span class="required">*</span></label>
                                        <lazy-dropdown
                                                selected-item="selectedSubCoa"
                                                display-property="name"
                                                display-subtext="label"
                                                search-property="name"
                                                placeholder="Search {{ voucher_details.chartOfAccountsSource || 'Sub Accounts' }}..."
                                                load-items="fetchSubAccounts(params)"
                                                on-select="onSubAccountChange(item)">
                                        </lazy-dropdown>
                                    </div>

                                    <div ng-class="{'col-sm-12 col-md-7': isSubAccHide, 'col-sm-12 col-md-2': !isSubAccHide}">&nbsp;</div>

                                    <div class="col-xs-12 col-md-2">
                                        <label>Debit <span class="required">*</span></label>
                                        <input class="form-control pastedString"
                                               type="text"
                                               id="debitAmount"
                                               ng-model="voucher_details.debitAmount"
                                               ng-disabled="voucher_details.creditAmount!=''"
                                               placeholder="Amount"
                                               maxlength="17"
                                               onkeypress="return validateFloatKeyPress(this, event);" />
                                    </div>
                                    <div class="col-xs-12 col-md-2">
                                        <label>Credit <span class="required">*</span></label>
                                        <input class="form-control pastedString"
                                               type="text"
                                               id="creditAmount"
                                               ng-model="voucher_details.creditAmount"
                                               ng-disabled="voucher_details.debitAmount!=''"
                                               placeholder="Amount"
                                               maxlength="17"
                                               onkeypress="return validateFloatKeyPress(this, event);" />
                                    </div>

                                    <br>

                                    <div class="col-xs-12 col-md-1">
                                        <action-button
                                                label="Add"
                                                icon="fa-check-circle"
                                                type="btn-primary"
                                                visible="!detailsAddBtnHide"
                                                on-click="addToGrid()">
                                        </action-button>

                                        <action-button
                                                label="Edit"
                                                icon="fa-check-circle"
                                                type="btn-yellow"
                                                visible="!detailsEditBtnHide"
                                                on-click="editToGrid()">
                                        </action-button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="widget-body">
                            <div class="widget-main">

                                <div class="row">
                                    <div class="col-md-12">
                                        <table id="voucher-details-table" class="table table-bordered table-hover">
                                            <thead>
                                            <tr>
                                                <th>SL</th>
                                                <th ng-hide="true">ID</th>
                                                <th ng-hide="true">COA Id</th>
                                                <th ng-hide="true"></th>
                                                <th>A/C Code & Name</th>
                                                <th ng-hide="true">Accounts Source</th>
                                                <th>Particulars</th>
                                                <th>Debit</th>
                                                <th>Credit</th>
                                                <th>Actions</th>
                                            </tr>
                                            </thead>
                                            <tbody>
                                                <tr ng-repeat="details in voucher_details_list">
                                                    <td><label>{{$index + 1}}</label></td>
                                                    <td ng-hide="true"><label>{{details.id}}</label></td>
                                                    <td ng-hide="true"><label>{{details.chartOfAccountsId}}</label></td>
                                                    <td ng-hide="true"><label>{{details.chartOfAccountsCodeName}}</label></td>
                                                    <td>
                                                        <label>
                                                            {{details.subAccountsId>0
                                                                ? details.chartOfAccountsCodeName + " -> " + details.subAccountsCodeName
                                                                : details.chartOfAccountsCodeName}}
                                                        </label>
                                                    </td>
                                                    <td ng-hide="true"><label>{{details.chartOfAccountsSource}}</label></td>
                                                    <td><label>{{details.particulars}}</label></td>
                                                    <td align='right'><label>{{details.primeAmount>0? details.amount: 0}}</label></td>
                                                    <td align='right'><label>{{details.primeAmount<0? details.amount: 0}}</label></td>
                                                    <td style="width:130px">
                                                        <input type="button"
                                                               style='font-size:12px'
                                                               value="Edit"
                                                               class="btn btn-no-border btn-yellow btn-round"
                                                               data-ng-click='populateRowData(details, $index)' />
                                                        <input type="button"
                                                               style='font-size:12px'
                                                               value="Delete"
                                                               class="btn btn-no-border btn-danger btn-round"
                                                               data-ng-click='deleteRow($index)' />
                                                    </td>
                                                </tr>
                                            </tbody>
                                            <tfoot>
                                                <tr style="font-weight:bold">
                                                    <td></td>
                                                    <td></td>
                                                    <td>Total </td>
                                                    <td align='right'></td>
                                                    <td align='right'></td>
                                                    <td>
                                                        <span ng-class="getBalanceClass()"
                                                              ng-bind-html="getBalanceText()"
                                                              style="padding: 5px 10px; border-radius: 5px; height: 24px;"
                                                              title="Debit and Credit must match to save">
                                                        </span>
                                                    </td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </div>
                                </div>

                            </div>
                        </div>

                        <div class="row  ">
                            <div class="col-xs-12 col-md-8">
                                <label>Amount(In words): </label>
                                <input style="font-weight:bold" class="form-control" type="text"  name="amountInWords" id="amountInWords" placeholder="Amount in Words" readonly="readonly"/>
                            </div>

                            <div class="col-xs-12 col-md-4">
                                <div class="form-actions pull-right">

                                    <button type="button" ui-sref="{{JCOMPONENT.acc_journal_voucher_list_view}}" ng-show="true" class="btn btn-sm btn-danger">
                                        <i class="ace-icon fa fa-close"></i>Cancel
                                    </button>

                                    <span class="btn-divider" ng-show="current_state === JCOMPONENT.acc_journal_voucher_add_view"></span>

                                    <button type="button" ng-show="current_state === JCOMPONENT.acc_journal_voucher_add_view" class="btn btn-sm btn-warning" ng-click="resetForm()">
                                        <i class="ace-icon fa fa-recycle"></i>Reset
                                    </button>

                                    <span class="btn-divider"></span>

                                    <button type="submit" class="btn btn-sm btn-primary">
                                        <i class="ace-icon fa fa-check-circle"></i>
                                        <span ng-if="current_state === JCOMPONENT.acc_journal_voucher_add_view" >Save</span>
                                        <span ng-if="current_state === JCOMPONENT.acc_journal_voucher_update_view" >Update</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>


                </div>
            </div>
        </div>

    </div>

</div>
