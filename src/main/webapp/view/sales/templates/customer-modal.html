<modal-base modal-id="customerModal" modal-size="modal-sm" on-hide="clearCustomerForm(customerForm)" focus-on-show>
    <div ng-form="customerForm" novalidate>
        <div class="modal-header bg-primary text-white">
            <button type="button" class="close" data-dismiss="modal" ng-click="resetForm()">&times;</button>
            <h4 class="modal-title" style="color: white;">
                <span class="glyphicon glyphicon-user"></span> Customer Info
            </h4>
        </div>

        <div class="modal-body">
            <!-- Search -->
            <div class="form-group">
                <label>Search (Mobile / Name)</label>
                <div class="input-group">
                    <input type="text" class="form-control" ng-model="search.string" placeholder="Enter mobile or name">
                    <span class="input-group-btn">
                        <button class="btn btn-sm btn-info" ng-click="searchCustomer()">Search</button>
                    </span>
                </div>
            </div>

            <!-- Results -->
            <div ng-if="searchResults.length > 0">
                <ul class="list-group search-results">
                    <li class="list-group-item" style="color: black;"
                        ng-repeat="c in searchResults | limitTo: showAll ? searchResults.length : 3"
                        ng-click="selectCustomer(c)">
                        {{c.customerName}}
                        <small class="text-muted">[{{c.mobileNumber}}]</small>
                    </li>
                </ul>
                <button type="button"
                        class="btn btn-link btn-sm"
                        ng-if="searchResults.length>3"
                        ng-click="toggleShowAll()">
                    {{showAll ? "Show Less" : "Show More"}}
                </button>
            </div>

            <hr>

            <!-- Form -->
            <div class="form-group">
                <label>Mobile Number<span class="required">*</span></label>
                <input type="text" class="form-control"
                       name="customerMobile"
                       ng-model="customer.mobileNumber"
                       ng-pattern="/^\d{11}$/"
                       required>
                <span class="text-danger" ng-show="customerForm.customerMobile.$touched && customerForm.customerMobile.$error.required">
                    Mobile number is required
                </span>
                <span class="text-danger" ng-show="customerForm.customerMobile.$touched && customerForm.customerMobile.$error.pattern">
                    Must be exactly 11 digits
                </span>
            </div>

            <div class="form-group">
                <label>Name</label>
                <input type="text" class="form-control"
                       ng-model="customer.customerName"
                       capitalize-words
                       placeholder="Enter name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" class="form-control" ng-model="customer.email">
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea class="form-control" ng-model="customer.address" rows="2"></textarea>
            </div>
        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-default btn-sm" data-dismiss="modal" ng-click="resetForm()">Cancel</button>
            <button type="button"
                    class="btn btn-info btn-sm"
                    ng-click="clearCustomerForm(customerForm)">
                Clear
            </button>
            <button type="submit"
                    class="btn btn-success btn-sm"
                    ng-click="saveCustomer(customerForm)"
                    ng-disabled="customerForm.$invalid">
                Save
            </button>
        </div>
    </div>
</modal-base>
