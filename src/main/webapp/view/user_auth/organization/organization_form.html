<div growl style="position: fixed; float: right; top:50px; right: 10px;"></div>

<div class="row">

    <div class="col-sm-4 col-md-4 col-lg-4" >&nbsp;</div>
    
    <div class="col-sm-4 col-md-4 col-lg-4">
        
        <div class="card">
            <div class="card-header row">
                <div class="col-sm-10">
                    <h4 class="card-title">
                        {{page_name}}
                    </h4>
                    <p class="subtitle">Organization setup</p>
                </div>
            </div>
            <div class="card-body">
                <div class="card-main">
                    <form ng-submit="saveModule()">
                        <div class="row" style="padding-left: 40px; padding-right: 40px;">

                            <div class="form-group">
                                <label>Name </label>
                                <input class="form-control" type="text" ng-model="module.name" placeholder="Name"/>
                            </div>

                            <div class="form-group">
                                <label>Title </label>
                                <input class="form-control" type="text" ng-model="module.title" placeholder="Title"/>
                            </div>

                            <div class="form-group">
                                <label>Short Name </label>
                                <input class="form-control" type="text" ng-model="module.shortName" placeholder="Short Name"/>
                            </div>

                            <div class="form-group">
                                <label>Address1</label>
                                <textarea class="form-control" ng-model="module.address1" placeholder="Address1"></textarea>
                            </div>

                            <div class="form-group">
                                <label>Address2</label>
                                <textarea class="form-control" ng-model="module.address2" placeholder="Address2"></textarea>
                            </div>

                            <div class="form-group">
                                <label>Web Url </label>
                                <input class="form-control" type="text" ng-model="module.webUrl" placeholder="Web Url"/>
                            </div>

                            <div class="form-group">
                                <label>Email </label>
                                <input class="form-control" type="text" ng-model="module.email" placeholder="Email"/>
                            </div>

                            <div class="form-group">
                                <label>Contact Name </label>
                                <input class="form-control" type="text" ng-model="module.contactName" placeholder="Contact Name"/>
                            </div>

                            <div class="form-group">
                                <label>Contact Phone </label>
                                <input class="form-control" type="text" ng-model="module.contactPhone" placeholder="Contact Phone"/>
                            </div>

                            <div class="form-group">
                                <label>Logo </label>
                                <input class="form-control" type="text" ng-model="module.logo" placeholder="Logo"/>
                            </div>

                            <div class="form-group">
                                <label>Status</label><br>
                                <label class="switch">
                                    <input type="checkbox" ng-model="module.active">
                                    <span class="slider round"></span>
                                </label>
                            </div>

                            <div class="form-group">
                                <div class="form-actions pull-right">

                                    <button type="button" ng-show="!isUpdate" class="btn btn-sm btn-danger" ng-click="resetModule()">
                                        <i class="ace-icon fa fa-close"></i>Cancel
                                    </button>

                                    <span class="btn-divider" ng-show="!isUpdate"></span>

                                    <button type="reset" ng-show="!isUpdate" class="btn btn-sm btn-warning" ng-click="resetModule()">
                                        <i class="ace-icon fa fa-recycle"></i>Reset
                                    </button>

                                    <span class="btn-divider"></span>

                                    <button type="submit" class="btn btn-sm btn-primary">
                                        <i class="ace-icon fa fa-check-circle"></i>
                                        <span ng-if="!isUpdate" >Save</span>
                                        <span ng-if="isUpdate" >Update</span>
                                    </button>
                                </div>
                            </div>
                            
                        </div>        
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="/res/css/custom-pos.css">
