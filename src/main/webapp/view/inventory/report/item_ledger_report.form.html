<div growl style="position: fixed; float: right; top:50px; right: 10px;"></div>

<div class="row" ng-init="getItemList()">

    <div class="col-sm-3 col-md-3 col-lg-3">&nbsp;</div>
    <div class="col-sm-12 col-md-6 col-lg-6">

        <div class="widget-box">
            <div class="widget-header">
                <h4 class="widget-title">{{page_name}}</h4>

                <span class="widget-toolbar">
                    
                </span>
            </div>
            <div class="widget-body">
                <div class="widget-main">

                    <form ng-submit="">
                        <div class="row">
                            <div class="col-md-3">&nbsp;</div>
                            <div class="col-md-6">

                                <div class="row">
                                    <div class="input-group width170 date" id="fromDate" style="float: left; margin-right: 8px;">
                                        <input type="text"
                                               class="form-control"
                                               placeholder="From Date"
                                               ng-model="search.fromDate"
                                               formatted-date-picker />
                                        <span class="input-group-addon">
                                            <i class="fa fa-calendar-check-o" style="color:#3C8DBC;"></i>
                                        </span>
                                    </div>

                                    <div class="input-group width170 date" id="toDate" style="float: left; margin-right: 8px;">
                                        <input type="text"
                                               class="form-control"
                                               placeholder="To Date"
                                               ng-model="search.toDate"
                                               formatted-date-picker />
                                        <span class="input-group-addon">
                                            <i class="fa fa-calendar-check-o" style="color:#3C8DBC;"></i>
                                        </span>
                                    </div>
                                </div><br>

                                <div class="row">
                                    <appcode-dropdown
                                            type="Warehouse"
                                            model="search.warehouse"
                                            placeholder="Select warehouse">
                                    </appcode-dropdown>
                                </div><br>

                                <div class="row">
                                    <lazy-dropdown
                                            selected-item="search.selectedItem"
                                            display-property="item_name_code"
                                            display-subtext="label"
                                            search-property="item_name_code"
                                            placeholder="Search items..."
                                            load-items="fetchItems(params)"
                                            on-select="onItemChange(item)" >
                                    </lazy-dropdown>
                                </div><br>

                                <div class="row">
                                    <appcode-dropdown
                                            type="Report Type"
                                            model="search.reportType"
                                            placeholder="Select report type">
                                    </appcode-dropdown>
                                </div>
                            </div>
                            <div class="col-md-3">&nbsp;</div>

                            <div class="col-md-12">
                                <div class="form-actions" align="center">
                                    
                                    <button type="button" class="btn btn-sm btn-warning" ng-click="itemLedgerPreview()">
                                        <i class="ace-icon fa fa-recycle"></i> Preview
                                    </button>

                                </div>
                            </div>
                            <div class="col-md-3">&nbsp;</div>
                        </div>        
                    </form>
                </div>
            </div>
        </div>

    </div>

</div>
