<div growl style="position: fixed; float: right; top:50px; right: 10px;"></div>

<div class="row">

    <div class="col-sm-3 col-md-3 col-lg-3">&nbsp;</div>

    <div class="col-sm-6 col-md-6 col-lg-6">

        <div class="widget-box">
            <div class="widget-header row">
                <div class="col-sm-6">
                    <h4 class="widget-title">
                        {{page_name}}
                    </h4>
                    <p class="subtitle">Add new items for stock tracking</p>
                </div>
                <div class="col-sm-6" >
                    <span class="widget-toolbar pull-right">
                        <a class="btn btn-sm btn-primary" ui-sref="{{JCOMPONENT.item_master_list_view}}">
                            <i class="ace-icon fa fa-backward"></i> Back
                        </a>
                    </span>
                </div>
            </div>
            <div class="widget-body">
                <div class="widget-main">
                    <form ng-submit="saveModule()">
                        <div class="widget-main">
                            <div class="row">
                                <div class="col-xs-12 col-md-6">
                                    <label>Item Code</label>
                                    <input class="form-control" type="text" id="itemCode" ng-model="module.itemCode"
                                           placeholder="Item Code" ng-readonly="true"/>

                                </div>

                                <div class="col-xs-12 col-md-6">
                                    <label>Item Name <span class="required">*</span></label>
                                    <input class="form-control" type="text" id="itemName" ng-model="module.itemName"
                                           style="text-transform: capitalize;" placeholder="Item Name"/>
                                </div>

                                <div class="col-xs-12">
                                    <label>Description </span></label>
                                    <textarea class="form-control" ng-model="module.description" placeholder="Description"></textarea>

                                </div>

                                <div class="col-xs-12 col-md-6">
                                    <label>Category</label>
                                    <appcode-dropdown type="Category" model="module.category"></appcode-dropdown>
                                </div>

                                <div class="col-xs-12 col-md-6">
                                    <label>Brand</label>
                                    <appcode-dropdown type="Brand" model="module.brand"></appcode-dropdown>
                                </div>

                                <div class="col-xs-12 col-md-6">
                                    <label for="model">Model</label>
                                    <input class="form-control" type="text" id="model" ng-model="module.model"
                                           style="text-transform: capitalize;" placeholder="Model"/>
                                </div>

                                <div class="col-xs-12 col-md-6">
                                    <label>Color</label>
                                    <appcode-dropdown type="Color" model="module.color"></appcode-dropdown>
                                </div>

                                <div class="col-xs-12 col-md-6">
                                    <label>Storage </label>
                                    <input class="form-control" type="text" id="storage" ng-model="module.storage"
                                           style="text-transform: capitalize;" placeholder="Storage"/>
                                </div>

                                <div class="col-xs-12 col-md-6">
                                    <label>Unit</label>
                                    <appcode-dropdown type="Unit" model="module.unit"></appcode-dropdown>
                                </div>

                                <div class="col-xs-12 col-md-6">
                                    <label>Price </label>
                                    <input class="form-control" type="tel" id="price" ng-model="module.price"
                                           ng-pattern-restrict="^[0-9]*$" placeholder="Price"/>
                                </div>

                                <div class="col-xs-12 col-md-6">
                                    <label>Standard Price </label>
                                    <input class="form-control" type="tel" id="standardPrice"
                                           ng-model="module.standardPrice" ng-pattern-restrict="^[0-9]*$"
                                           placeholder="Standard Price"/>
                                </div>

                                <div class="col-xs-12 col-md-6">
                                    <label>IMEI </label>
                                    <input class="form-control" type="tel" id="imei" ng-model="module.imei"
                                           placeholder="imei"/>
                                </div>


                                <div class="col-md-12 col-md-6">
                                    <label>Status </label><br>
                                    <input type="checkbox" ng-model="module.active">
                                </div>

                                <div class="col-md-12">
                                    <div class="form-actions pull-right">

                                        <button type="button" ui-sref="{{JCOMPONENT.item_master_list_view}}" ng-show="true"
                                                class="btn btn-sm btn-danger">
                                            <i class="ace-icon fa fa-close"></i>Cancel
                                        </button>

                                        <span class="btn-divider" ng-show="current_state === JCOMPONENT.item_master_add_view"></span>

                                        <button type="reset" ng-show="current_state === JCOMPONENT.item_master_add_view"
                                                class="btn btn-sm btn-warning" ng-click="reset()">
                                            <i class="ace-icon fa fa-recycle"></i>Reset
                                        </button>

                                        <span class="btn-divider"></span>

                                        <button type="submit" class="btn btn-sm btn-primary">
                                            <i class="ace-icon fa fa-check-circle"></i>
                                            <span ng-if="current_state === JCOMPONENT.item_master_add_view">Save</span>
                                            <span ng-if="current_state === JCOMPONENT.item_master_update_view">Update</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>


    </div>


</div>
