<div class="row" ng-init="getDataList(currentPage, itemPerPage)">

    <div class="col-xs-12">
        <div class="filter-area">
            <div class="row">
                <div class="col-xs-12">
                    <a class="btn btn-sm btn-success pull-right" ui-sref="{{JCOMPONENT.item_master_add_view}}">
                        <i class="ace-icon fa fa-plus"></i> Item Create
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="col-sm-12 col-md-12 col-lg-12">
        <table id="simple-table" class="table  table-bordered table-hover">
            <thead>
                <tr>
                    <th>Item Code</th>
                    <th>Item Name</th>
                    <th>Image</th>
                    <th>Category</th>
                    <th>Brand</th>
                    <th style="text-align:right">Selling Price</th>
                    <th style="text-align:right">Purchase Price</th>
                    <th class="text-center">Status</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="obj in data.items">
                    <td>{{obj.itemCode}}</td>
                    <td>{{obj.itemName}}</td>
                    <td style="width: 50px;">
                        <div class="img-wrapper">
                            <img ng-src="{{obj.fileName ? '/uploads/inventory/' + obj.fileName : '/res/images/no-image.png'}}"
                                 alt="{{obj.name}}" class="table-img">
                            <div class="img-preview">
                                <img ng-src="{{obj.fileName ? '/uploads/inventory/' + obj.fileName : '/res/images/no-image.png'}}" alt="{{obj.name}}">
                            </div>
                        </div>
                    </td>
                    <td>{{obj.category}}</td>
                    <td>{{obj.brand}}</td>
                    <td style="text-align:right">{{obj.price}}</td>
                    <td style="text-align:right">{{obj.purchasePrice}}</td>
                    <td class="text-center">
                        <label ng-if="obj.active===false || obj.active===0" class="label label-danger">Inactive</label>
                        <label ng-if="obj.active===true || obj.active===1" class="label label-success">Active</label>
                    </td>

                    <td class="text-center">
                        <button class="btn btn-sm btn-warning btn-no-border btn-round" ng-click="showEditForm(obj)"> <i class="ace-icon fa fa-edit"></i> Edit</button>
                    </td>
                </tr>
                <tr ng-if="data.items.length < 1">
                    <td colspan="9"><h5>No data found!!!</h5></td>
                </tr>
            </tbody>
        </table>
        <div sarker-pagination item-count="data.itemCount" item-per-page="itemPerPage" selected-page="currentPage" get-items="getDataList(pageNumber, itemPerPage)"></div>
    </div>



</div>
